version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: subscrify_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-subscrify_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - subscrify-net

  redis:
    image: redis:7-alpine
    container_name: subscrify_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - subscrify-net

volumes:
  postgres_data:
  redis_data:

networks:
  subscrify-net:
    driver: bridge